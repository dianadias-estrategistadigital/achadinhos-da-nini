}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}

function brl(v){ return 'R$ ' + v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
/* Melhor condição = preço, descontando um valor estimado de frete quando a loja dá frete grátis */
var FRETE_EST = 15;
function custo(l){ return l[1] - (l[3] ? FRETE_EST : 0); }
function menor(p){ return p.lojas.reduce(function(a,b){ return custo(b)<custo(a)?b:a; }); }
function precoTxt(p){ return p.real ? brl(menor(p)[1]) : ''; }
function nomeFio(id){ var f=FIOS.find(function(x){return x.id===id}); return f?f.nome:''; }
function nomeProb(id){ var f=PROBLEMAS.find(function(x){return x.id===id}); return f?f.nome:''; }
function nomeDept(id){ var f=DEPTS.find(function(x){return x.id===id}); return f?f.nome:''; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

function semAcento(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function filtrados(){
  var q = state.busca.trim().toLowerCase();
  return PRODUTOS.filter(function(p){
    if(state.dept && p.dept!==state.dept) return false;
    if(state.cat && p.cat!==state.cat) return false;
    if(state.dept==='cabelo'){
      if(state.fio && p.fios.indexOf(state.fio)<0) return false;
      if(state.probs.length && !state.probs.some(function(x){return p.probs.indexOf(x)>=0})) return false;
    }
    if(q && semAcento(p.marca+' '+p.nome+' '+p.cat+' '+nomeDept(p.dept)+(p.kr?' coreano':'')).indexOf(semAcento(q))<0) return false;
    return true;
  });
}
function paraVoce(){
  return PRODUTOS.filter(function(p){
    if(p.dept!=='cabelo') return false;
    if(state.fio && p.fios.indexOf(state.fio)<0) return false;
    if(state.probs.length && !state.probs.some(function(x){return p.probs.indexOf(x)>=0})) return false;
    return true;
  });
}

}

/* ---------- Carrosséis ---------- */
var TIMERS = [], slideAtual = 0;
function mostrarSlide(i){
  slideAtual = i;
  document.querySelectorAll('.hero-car .slide').forEach(function(s,k){ s.classList.toggle('on', k===i); });
  document.querySelectorAll('.hero-car .dots button').forEach(function(b,k){ b.setAttribute('aria-current', String(k===i)); });
}
function moverCarrossel(r, dir){
  var c = r.firstElementChild; if(!c) return;
  var step = c.getBoundingClientRect().width + 12;
  if(dir>0 && r.scrollLeft + r.clientWidth >= r.scrollWidth - 4) r.scrollTo({left:0});
  else if(dir<0 && r.scrollLeft <= 4) r.scrollTo({left:r.scrollWidth});
  else r.scrollBy({left: step*dir});
}
function setupCarrosseis(){
  TIMERS.forEach(clearInterval); TIMERS = [];
  var hc = document.querySelector('.hero-car'); if(hc) mostrarSlide(slideAtual);
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.car .rail').forEach(function(r){
    var pausa = false;
    r.addEventListener('pointerenter', function(){ pausa=true; }); r.addEventListener('pointerleave', function(){ pausa=false; });
    r.addEventListener('touchstart', function(){ pausa=true; }, {passive:true});
    TIMERS.push(setInterval(function(){ if(!pausa && !document.hidden) moverCarrossel(r, 1); }, 3200));
  });
  if(hc){ var hp=false; hc.addEventListener('pointerenter', function(){ hp=true; }); hc.addEventListener('pointerleave', function(){ hp=false; });
    TIMERS.push(setInterval(function(){ if(!hp && !document.hidden) mostrarSlide((slideAtual+1)%3); }, 5500)); }
}

function nivel(v){ return Math.max(5, Math.min(100, Math.round(v))); }
function calcScores(ped){
  var q = ped.queixas||[], quim = (ped.quimica||[]).filter(function(x){return x!=='Nenhuma'}), hab = ped.habitos||[], sint = ped.sintomas||[];
  var tem = function(arr, v){ return arr.indexOf(v)>=0; };
  var H=35, N=30, R=15, C=15;
  if(tem(q,'frizz')) H+=20; if(ped.porosidade==='Alta'){ H+=15; N+=10; } if(ped.porosidade==='Baixa') H-=5;
  if(ped.calor==='Quase todo dia'){ H+=10; R+=15; } if(ped.temperatura==='Acima de 180 °C') R+=10;
  if(tem(hab,'Piscina')||tem(hab,'Mar')||tem(hab,'Sol frequente')){ H+=10; N+=5; }
  if(ped.espessura==='Fino') H+=5;
  if(tem(q,'ressecamento')) N+=25; if(ped.fio==='cacheado'||ped.fio==='crespo') N+=15; if(ped.couro==='Seco'||ped.couro==='Misto') N+=10;
  if(quim.length) R+=25; if(tem(quim,'Descoloração')) R+=20; if(tem(q,'quimica')) R+=10;
  if(ped.elasticidade==='Elástico') R+=20; if(ped.elasticidade==='Quebradiço'){ R+=15; N+=10; }
  if(ped.quandoQuimica==='Menos de 1 mês') R+=5;
  if(ped.couro==='Oleoso'||tem(q,'oleosidade')) C+=30; if(ped.couro==='Misto') C+=15;
  if(tem(q,'queda')||tem(sint,'Queda acima do normal')) C+=30;
  if(tem(sint,'Coceira')||tem(sint,'Caspa ou descamação')||tem(sint,'Sensibilidade')) C+=20;
  if(tem(hab,'Dorme de cabelo molhado')) C+=10;
  return {H:nivel(H), N:nivel(N), R:nivel(R), C:nivel(C)};
}
var NECESS = {H:'Hidratação', N:'Nutrição', R:'Reconstrução', C:'Couro cabeludo'};
var FX_LIM = {economica:[0,120], intermediaria:[120,250], premium:[250,1e9]};
function candEtapa(ped, cats, f, extra){
  var lim = FX_LIM[f], q = (ped.queixas||[]).concat(extra||[]);
  var c = PRODUTOS.filter(function(x){ var m=menor(x)[1]; return x.dept==='cabelo' && cats.indexOf(x.cat)>=0 && (!ped.fio || x.fios.indexOf(ped.fio)>=0) && m>=lim[0] && m<lim[1]; });
  c.sort(function(a,b){ return b.probs.filter(function(z){return q.indexOf(z)>=0}).length - a.probs.filter(function(z){return q.indexOf(z)>=0}).length; });
  return c;
}
function idsEtapa(ped, cats, extra){ var o={}; ['economica','intermediaria','premium'].forEach(function(f){ var c=candEtapa(ped,cats,f,extra); o[f]=c.length?c[0].id:null; }); return o; }
function sugerirPrescricao(ped){
  var s = calcScores(ped), quim = (ped.quimica||[]).filter(function(x){return x!=='Nenhuma'}), hab = ped.habitos||[];
  var ord = ['H','N','R'].sort(function(a,b){ return s[b]-s[a]; });
  var crono = ord[0]==='R' ? ['H','R','N','R'] : ord[0]==='N' ? (s.R>=50?['H','N','R','N']:['H','N','H','N']) : (s.R>=50?['H','R','H','N']:['H','H','N','H']);
  var cacho = ped.fio==='cacheado' || ped.fio==='crespo';
  var lav = ped.couro==='Oleoso' ? '4 a 5 vezes por semana, com shampoo suave' : cacho ? '2 a 3 vezes por semana' : '3 vezes por semana';
  var maior = ['H','N','R','C'].sort(function(a,b){ return s[b]-s[a]; })[0];
  var focoTxt = {H:'devolver água ao fio e controlar o frizz', N:'repor óleos e trazer brilho e maciez', R:'repor massa e segurar a quebra', C:'equilibrar o couro cabeludo e cuidar da raiz'}[maior];
  var diag = 'Fio '+(nomeFio(ped.fio)||'').toLowerCase()+(ped.espessura?' e '+ped.espessura.toLowerCase():'')+(ped.comprimento?', '+ped.comprimento.toLowerCase():'')+

    (ped.couro ? 'Couro cabeludo '+ped.couro.toLowerCase()+'. ' : '')+
    (ped.porosidade && ped.porosidade!=='Não fiz' ? 'Porosidade '+ped.porosidade.toLowerCase()+'. ' : '')+
    'A maior necessidade agora é '+NECESS[maior].toLowerCase()+': o plano foca em '+focoTxt+'.';
  var et = [
    {etapa:'Shampoo', cats:['Shampoo'], extra:s.C>=45?['oleosidade','queda']:[], como:'Duas lavagens: a primeira limpa, a segunda trata. Massageie a raiz com a ponta dos dedos.'},
    {etapa:'Tratamento do cronograma', cats:['Máscara','Tratamento'], extra:s.R>=50?['quimica']:['ressecamento'], como:'A máscara da semana (veja o cronograma), do meio para as pontas, por 10 a 15 minutos.'},
    {etapa:'Condicionador', cats:['Condicionador'], extra:[], como:'Nos dias sem máscara, do meio para as pontas. Enxágue com água fria.'},
    {etapa:cacho?'Leave-in e finalização':'Leave-in e proteção', cats:['Leave-in','Protetor térmico','Finalizador'], extra:[], como:cacho?'No cabelo bem molhado, por mechas. Deixe secar sem mexer.':'No cabelo úmido, antes de secar. Protege do calor e do frizz.'},
    {etapa:'Óleo ou sérum', cats:['Óleo e sérum'], extra:[], como:'Uma ou duas gotas nas pontas, com o cabelo seco.'}
  ];
  if(s.C>=45) et.push({etapa:'Couro cabeludo', cats:['Antiqueda','Shampoo'], extra:['queda','oleosidade'], como:'Direto na raiz, conforme a embalagem. O resultado aparece com uso contínuo.'});
  var etapas = et.map(function(e){ return {etapa:e.etapa, cats:e.cats, como:e.como, ids:idsEtapa(ped, e.cats, e.extra)}; })
    .filter(function(e){ return e.ids.economica || e.ids.intermediaria || e.ids.premium; });
  var alertas = [];
  if(quim.indexOf('Descoloração')>=0 && ped.quandoQuimica==='Menos de 1 mês') alertas.push('Evite nova química por pelo menos 30 dias. O fio ainda está sensível.');
  if(ped.temperatura==='Acima de 180 °C') alertas.push('Baixe a prancha para até 180 °C e use sempre protetor térmico.');
  if(ped.calor==='Quase todo dia') alertas.push('Tente usar calor no máximo 2 vezes por semana.');
  if((ped.saude||[]).some(function(x){ return x!=='Nada disso'; })) alertas.push('Antes de qualquer química, converse com o seu médico.');
  if(ped.elasticidade==='Quebradiço') alertas.push('Fio quebradiço: um corte das pontas danificadas faz o tratamento render mais.');
  var salao = [];
  if(s.R>=55) salao.push('Reconstrução profissional a cada 15 dias no primeiro mês');

  if(s.H>=55) salao.push('Hidratação profunda no salão uma vez por mês');
  if(s.C>=50) salao.push('Terapia capilar com detox do couro cabeludo');
  if(!salao.length) salao.push('Manutenção no salão a cada 45 dias');
  var dicas = [];
  if(ped.lavagem==='Todo dia' && s.C<45) dicas.push('Se der, lave dia sim, dia não.');
  if(hab.indexOf('Piscina')>=0 || hab.indexOf('Mar')>=0) dicas.push('Antes de piscina ou mar, molhe o cabelo com água doce e passe leave-in.');
  if(hab.indexOf('Dorme de cabelo molhado')>=0) dicas.push('Evite dormir de cabelo molhado: seque pelo menos a raiz.');

  return {versao:2, diagnostico:diag, scores:s, cronograma:crono, lavagens:lav, etapas:etapas, alertasTxt:alertas.join('\n'), salaoTxt:salao.join('\n'), dicas:dicas.join(' ')};

  return PRODUTOS.filter(function(x){ var m=menor(x)[1]; return x.dept==='cabelo' && (!ped.fio || x.fios.indexOf(ped.fio)>=0) && m>=lim[0] && m<lim[1]; }).slice(0,8);
}

      '<div class="options">'+FIOS.map(function(f){ return '<button class="opt" data-qfio="'+f.id+'" aria-pressed="'+(state.quiz.fio===f.id)+'"><b>'+f.nome+'</b><span>'+f.desc+'</span></button>'; }).join('')+'</div>'+

function render(){
  var app = document.getElementById('app');
  app.className = 'app t-' + (state.quiz ? 'quiz' : state.tab);
  if(state.quiz){ app.innerHTML = telaQuiz(); }
  else app.innerHTML = {inicio:telaInicio, feed:telaFeed, achadinhos:telaAchadinhos, coreanos:telaCoreanos, diagnostico:telaDiagnostico, grupo:telaGrupo, painel:telaPainel, pronta:telaPronta, ofertas:telaOfertas}[state.tab]();
  setupCarrosseis();
  var bh = document.getElementById('busca-home');
  if(bh){ bh.addEventListener('input', function(){
    state.busca = bh.value; state.dept = null; state.cat = null; irPara('achadinhos');
    var nb = document.getElementById('busca'); if(nb){ nb.focus(); var n = nb.value.length; try{ nb.setSelectionRange(n,n); }catch(e){} }
  }); }
  var fi = document.getElementById('f-fotos');
  if(fi){ fi.addEventListener('change', function(){ var fs = Array.prototype.slice.call(fi.files||[], 0, 6); state.form.fotos = fs.length; state.form.fotosUrls = fs.map(function(f){ return URL.createObjectURL(f); }); render(); }); }
  document.querySelector('.tabs').hidden = !!state.quiz;
  document.querySelectorAll('.tab').forEach(function(t){ if(t.dataset.tab===state.tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  var b = document.getElementById('busca');
  if(b){ b.addEventListener('input', function(){ state.busca=b.value; var pos=b.selectionStart; render(); var nb=document.getElementById('busca'); nb.focus(); try{nb.setSelectionRange(pos,pos);}catch(e){} }); }

function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
/* WhatsApp e grupo: números vêm do index.html publicado (window.NINI_WHATS / window.NINI_GRUPO) */
function abrirWhats(el){
  var num = (window.NINI_WHATS||'').replace(/\D/g,''), grupo = window.NINI_GRUPO||'';
  var txt = el.textContent || '';
  var url = '';
  var paraCliente = state.tab==='painel' && state.pedAberto && state.pedAberto.whats;
  if(/grupo|clube/i.test(txt)) url = grupo;
  else {
    var destino = paraCliente ? state.pedAberto.whats.replace(/\D/g,'') : num;
    var msg = paraCliente ? 'Oi, '+((state.pedAberto.nome||'').split(' ')[0])+'! Aqui é a Nini, recebi seu pré-diagnóstico.' :
      /agendar/i.test(txt) ? 'Oi, Nini! Quero agendar meu diagnóstico capilar.' : 'Oi, Nini! Vim pelo app Achadinhos da Nini.';
    if(destino){ if(destino.length<=11) destino = '55'+destino; url = 'https://wa.me/'+destino+'?text='+encodeURIComponent(msg); }
  }
  if(url) window.open(url, '_blank', 'noopener');
  else toast('O WhatsApp da Nini entra aqui em breve.');
}
function irPara(tab){
  state.tab=tab; state.quiz=null;
  if(tab==='diagnostico'){ if(state.diag!=='form') state.diag='home'; carregarMeu(); }
  if(tab==='painel'){ state.pedAberto=null; state.editor=null; carregarPedidos(); carregarEstoque(); carregarReservas(); }
  if(tab==='pronta'){ carregarEstoque(); }
  if(tab==='ofertas'){ carregarOfertas(); }
  render(); window.scrollTo(0,0);
}
function validarPasso(){
  var f = state.form, p = state.passo;
  if(p===1){ if(!(f.nome||'').trim()) return 'Escreva seu nome para continuar.'; if((f.whats||'').replace(/\D/g,'').length<10) return 'Coloque o WhatsApp com DDD.'; }
  if(p===2 && !f.fio) return 'Escolha o tipo de fio.';
  if(p===TOTAL_PASSOS && !f.formato) return 'Escolha como prefere a consulta.';
  return '';
}
async function enviarPedido(){
  var f = state.form;
  var ped = {};
  Object.keys(f).forEach(function(k){ if(k!=='fotosUrls'){ var v = f[k]; ped[k] = typeof v==='string' ? v.trim() : v; } });
  ped.fotos = f.fotos||0; ped.status = 'novo';
  try{
    var id = await store.add('pedidos', ped);
    try{ localStorage.setItem('nini-meu-pedido', (SB && store.ultimoToken) ? store.ultimoToken : id); }catch(e){}
    state.form = {quimica:[], queixas:[], sintomas:[], habitos:[], saude:[]}; state.passo = 1; state.diag = 'home';
    state.meuPedido = Object.assign({id:id}, ped); state.minhaPres = null;
    render(); window.scrollTo(0,0); toast('Pré-diagnóstico enviado para a Nini.');
  }catch(e){ state.erro = 'Não deu para enviar agora. Tente de novo em instantes.'; render(); }
}
async function enviarPrescricao(){
  var p = state.pedAberto, e = state.editor;
  e.passos = (e.passos||[]).filter(function(s){ return s.trim(); });
  e.enviadaEm = new Date().toISOString();
  try{
    await store.set('prescricoes', p.id, e);
    var ped = Object.assign({}, p); delete ped.id; ped.status = 'prescrito';
    await store.set('pedidos', p.id, ped);
    p.status = 'prescrito'; toast('Rotina enviada para '+(p.nome||'a cliente').split(' ')[0]+'.');
    render();
  }catch(err){ toast('Não deu para enviar agora. Tente de novo.'); }
}

      if(!p && !nome){ err.textContent='Escolha um produto do catálogo ou escreva o nome.'; err.hidden=false; return; }
      if(!(preco>0)){ err.textContent='Coloque o preço.'; err.hidden=false; return; }
      if(!(qtd>0)){ err.textContent='Coloque a quantidade.'; err.hidden=false; return; }
      var item={nome:p?p.nome:nome, marca:p?p.marca:'', prodId:p?p.id:null, preco:preco, qtd:qtd};
      try{ await store.add('estoque', item); await carregarEstoque(); toast('Produto adicionado à pronta entrega.'); }catch(x){ err.textContent='Não deu para salvar agora.'; err.hidden=false; }
    })(); return; }
  if(d.fsel){ var a=d.fsel.split('|'); state.form[a[0]]=a[1]; state.erro=''; render(); return; }
  if(d.fmul){ var b=d.fmul.split('|'), arr=state.form[b[0]]=(state.form[b[0]]||[]);
    var exc = EXCLUSIVOS[b[0]];
    var k=arr.indexOf(b[1]); if(k>=0) arr.splice(k,1); else { if(exc && b[1]===exc) arr.length=0; else if(exc){ var n=arr.indexOf(exc); if(n>=0) arr.splice(n,1); } arr.push(b[1]); }
    render(); return; }
  if(d.ped){ abrirPedido(d.ped); window.scrollTo(0,0); return; }
  switch(d.act){
    case 'painel': irPara('painel'); return;
    case 'diag-start': state.diag='form'; state.passo=1; state.erro=''; if(state.fio && !state.form.fio) state.form.fio=state.fio; if(state.probs.length && !state.form.queixas.length) state.form.queixas=state.probs.slice(); render(); window.scrollTo(0,0); return;
    case 'diag-next': state.erro=validarPasso(); if(!state.erro) state.passo++; render(); window.scrollTo(0,0); return;
    case 'diag-back': state.erro=''; if(state.passo>1) state.passo--; else state.diag='home'; render(); return;
    case 'diag-send': state.erro=validarPasso(); if(state.erro){ render(); return; } enviarPedido(); return;
    case 'diag-exemplo': state.diag='exemplo'; render(); window.scrollTo(0,0); return;
    case 'diag-home': state.diag='home'; render(); return;
    case 'ped-voltar': state.pedAberto=null; state.editor=null; carregarPedidos(); render(); return;
    case 'pres-sugerir': state.editor=sugerirPrescricao(state.pedAberto); render(); return;
    case 'pres-enviar': enviarPrescricao(); return;
  }
  if(d.ftipo!==undefined){ feedFiltro = d.ftipo || null; render(); return; }
  if(d.like){ curtidas[d.like] = !curtidas[d.like]; render(); return; }
  if(d.act==='comentar'){ toast('No app de verdade, as clientes comentam aqui.'); return; }
  if(d.act==='salvar-post'){ toast('Post salvo para ver depois.'); return; }
  if(d.act==='fechar'){ fechar(); if(!d.tab) return; }
  if(d.tab){ irPara(d.tab); return; }
  if(d.prod){ abrirProduto(+d.prod); return; }
  if(d.dept!==undefined){ state.dept = d.dept || null; state.cat=null; if(state.tab!=='achadinhos') irPara('achadinhos'); else render(); return; }
  if(d.cat!==undefined){ state.cat = d.cat || null; render(); return; }
  if(d.krcat!==undefined){ state.krcat = d.krcat || null; render(); return; }
  if(d.marca){ state.dept=null; state.cat=null; state.busca=d.marca.split(' ')[0]; irPara('achadinhos'); return; }
  if(d.fio!==undefined){ state.fio = d.fio || null; salvarPerfil(); render(); return; }
  if(d.prob){ var i=state.probs.indexOf(d.prob); if(i>=0) state.probs.splice(i,1); else state.probs.push(d.prob); salvarPerfil(); render(); return; }
  if(d.qfio){ state.quiz.fio=d.qfio; render(); return; }
  if(d.qprob){ var j=state.quiz.probs.indexOf(d.qprob); if(j>=0) state.quiz.probs.splice(j,1); else state.quiz.probs.push(d.qprob); render(); return; }
  switch(d.act){
    case 'quiz': state.quiz={passo:1, fio:state.fio, probs:state.probs.slice()}; render(); window.scrollTo(0,0); break;
    case 'q-next': if(state.quiz.fio){ state.quiz.passo=2; render(); } break;
    case 'q-sair': if(state.quiz.passo===2){ state.quiz.passo=1; } else { state.quiz=null; } render(); break;
    case 'q-fim': state.fio=state.quiz.fio; state.probs=state.quiz.probs; state.quiz=null; state.tab='inicio'; salvarPerfil(); render(); window.scrollTo(0,0); break;
    case 'limpar': state.dept=null; state.cat=null; state.fio=null; state.probs=[]; state.busca=''; salvarPerfil(); render(); break;
    case 'whats': abrirWhats(el); break;
  }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') fechar(); });
document.addEventListener('input', function(e){
  var t = e.target, d = t.dataset || {};
  if(d.fin){ state.form[d.fin] = t.value; if(state.erro){ state.erro=''; var er=document.querySelector('.err'); if(er) er.remove(); } }
  if(d.pin && state.editor){ state.editor[d.pin] = d.pin==='passos' ? t.value.split('\n') : t.value; }
});
document.addEventListener('change', function(e){
  var t = e.target, d = t.dataset || {};
  if(d.crono!==undefined && state.editor){ state.editor.cronograma[+d.crono] = t.value; }
  if(d.eprod && state.editor){ var ep = d.eprod.split('|'); state.editor.etapas[+ep[0]].ids[ep[1]] = t.value ? +t.value : null; }
  if(d.eprice){ var it=(state.estoque||[]).find(function(x){return x.id===d.eprice}); var v=parseFloat(t.value); if(it && v>=0){ it.preco=v; salvarItem(it).then(function(){ toast('Preço salvo.'); }).catch(function(){ toast('Não deu para salvar agora.'); }); } }
  if(d.pprod && state.editor){ var a=d.pprod.split('|'), id=+a[1], l=state.editor.faixas[a[0]]=(state.editor.faixas[a[0]]||[]);
    var i=l.indexOf(id); if(t.checked && i<0) l.push(id); if(!t.checked && i>=0) l.splice(i,1); }
});
render();
carregarEstoque();
carregarOfertas();
(async function(){
  if(!window.claude || !window.claude.use) return;
  try{ USER = await window.claude.use('user'); }catch(e){}
  if(USER && typeof USER.canEdit==='function'){ try{ var c = await USER.canEdit(); if(c===false) PODE_PAINEL=false; }catch(e){} }
  if(state.tab==='painel') render();
})();
</script>
